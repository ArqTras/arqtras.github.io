<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Reports — Daily / Monthly / Yearly</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net"/>
<style>
:root{--bg:#0b1020;--panel:#121a2a;--text:#e5ecff;--muted:#97a3c0}
*{box-sizing:border-box} body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
.wrap{max-width:960px;margin:0 auto;padding:24px 18px}
h1{margin:0 0 18px;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:#121a2a;border:1px solid #1e2a44;border-radius:16px;padding:16px;text-decoration:none;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.card:hover{outline:1px solid #2a3a64;transform:translateY(-1px)}
.card h2{margin:0 0 6px;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Network Activity Reports</h1>
  <div class="grid">
    <a class="card" href="report_daily.html">
      <h2>Daily</h2>
      <p>Full day-by-day stats & chart</p>
    </a>
    <a class="card" href="report_monthly.html">
      <h2>Monthly</h2>
      <p>Aggregated per month (fast & clear)</p>
    </a>
    <a class="card" href="report_yearly.html">
      <h2>Yearly</h2>
      <p>Aggregated per year (overview)</p>
    </a>
  </div>
</div>
</body>
</html>
